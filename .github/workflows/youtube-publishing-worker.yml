name: YouTube publishing worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-publishing-worker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate scheduler configuration
        env:
          BASE_URL: ${{ vars.AIVISO_BASE_URL }}
          CRON_SECRET: ${{ secrets.YOUTUBE_CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set the AIVISO_BASE_URL repository variable."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the YOUTUBE_CRON_SECRET repository secret."
            exit 1
          fi

      - name: Run YouTube publishing batch
        env:
          BASE_URL: ${{ vars.AIVISO_BASE_URL }}
          CRON_SECRET: ${{ secrets.YOUTUBE_CRON_SECRET }}
        run: |
          BASE_URL="${BASE_URL%/}"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 \
            --max-time 840 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            "$BASE_URL/api/youtube/publish/scheduler"
